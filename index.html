<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מי רוצה להיות מיליונר - סטטיסטיקה</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Confetti JS for victory animations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- MathJax for rendering LaTeX formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap');
        
        body { 
            font-family: 'Rubik', sans-serif; 
            background-color: #0f172a; 
            background-image: radial-gradient(circle at 50% 50%, #1e3a8a 0%, #0f172a 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism cards */
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* Millionaire Specific Styles */
        .mil-btn {
            background: linear-gradient(180deg, #1e3a8a 0%, #172554 100%);
            border: 2px solid #3b82f6;
            clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
            transition: all 0.2s;
            box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.2);
        }
        .mil-btn:hover { 
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%); 
            transform: scale(1.03); 
            border-color: #60a5fa;
        }
        .mil-btn.correct { 
            background: linear-gradient(180deg, #16a34a 0%, #14532d 100%); 
            border-color: #4ade80; 
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
        }
        .mil-btn.wrong { 
            background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%); 
            border-color: #f87171; 
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.5);
        }
        
        .mil-ladder-item { transition: all 0.3s; padding: 4px 12px; }
        .mil-ladder-item.active { 
            background-color: #eab308; 
            color: #422006; 
            font-weight: 900; 
            border-radius: 6px; 
            transform: scale(1.1) translateX(-10px); 
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.6);
        }
        .mil-ladder-item.passed { color: #facc15; }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-8">

    <div id="game-millionaire" class="w-full max-w-6xl flex flex-col md:flex-row gap-8 fade-in min-h-[85vh]">
        
        <!-- Main Game Area -->
        <div class="flex-1 flex flex-col">
            <div class="glass-card flex-1 flex flex-col p-6 md:p-10 relative">
                <!-- Logo/Graphic -->
                <div class="text-center mb-10">
                    <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center border-4 border-slate-900 shadow-[0_0_40px_rgba(250,204,21,0.6)] mb-4 animate-bounce" style="animation-duration: 3s;">
                        <span class="text-4xl text-slate-900"><i class="fa-solid fa-shekel-sign"></i></span>
                    </div>
                    <h2 class="text-3xl font-bold text-yellow-400 font-serif tracking-wide drop-shadow-lg mb-2">מי רוצה להיות סטטיסטיקאי?</h2>
                    <div class="text-blue-300 font-medium">הוכן על ידי: רגינה צ'ולסקי</div>
                </div>

                <!-- Question Container -->
                <div class="flex-1 flex flex-col justify-center">
                    <div class="bg-blue-950/80 border-2 border-blue-400 rounded-full py-8 px-12 mb-10 text-center shadow-[0_0_20px_rgba(59,130,246,0.3)] relative min-h-[140px] flex items-center justify-center">
                        <div class="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-blue-500 rotate-45 border-2 border-white"></div>
                        <div class="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-blue-500 rotate-45 border-2 border-white"></div>
                        <h3 id="mil-q-text" class="text-xl md:text-3xl font-bold leading-relaxed text-slate-100">טוען שאלה...</h3>
                    </div>

                    <!-- Options Grid -->
                    <div class="grid md:grid-cols-2 gap-4 gap-y-6">
                        <button class="mil-btn py-5 px-8 text-xl font-bold flex items-center justify-center text-center relative group" onclick="checkMilAnswer(0)">
                            <span class="absolute right-8 text-yellow-400 group-hover:text-yellow-300">א:</span>
                            <span id="mil-opt-0" class="tracking-wide">תשובה 1</span>
                        </button>
                        <button class="mil-btn py-5 px-8 text-xl font-bold flex items-center justify-center text-center relative group" onclick="checkMilAnswer(1)">
                            <span class="absolute right-8 text-yellow-400 group-hover:text-yellow-300">ב:</span>
                            <span id="mil-opt-1" class="tracking-wide">תשובה 2</span>
                        </button>
                        <button class="mil-btn py-5 px-8 text-xl font-bold flex items-center justify-center text-center relative group" onclick="checkMilAnswer(2)">
                            <span class="absolute right-8 text-yellow-400 group-hover:text-yellow-300">ג:</span>
                            <span id="mil-opt-2" class="tracking-wide">תשובה 3</span>
                        </button>
                        <button class="mil-btn py-5 px-8 text-xl font-bold flex items-center justify-center text-center relative group" onclick="checkMilAnswer(3)">
                            <span class="absolute right-8 text-yellow-400 group-hover:text-yellow-300">ד:</span>
                            <span id="mil-opt-3" class="tracking-wide">תשובה 4</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Money Ladder -->
        <div class="w-full md:w-64 glass-card p-6 flex flex-col justify-center items-center">
            <div class="w-full flex flex-col-reverse text-right font-mono text-xl space-y-reverse space-y-3" id="mil-ladder">
                <!-- Injected by JS -->
            </div>
        </div>

    </div>

    <!-- Millionaire End Screen (Overlay) -->
    <div id="mil-end-screen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-6 text-center fade-in">
        <h2 id="mil-end-title" class="text-6xl md:text-8xl font-black text-yellow-400 mb-6 font-serif drop-shadow-[0_0_20px_rgba(250,204,21,0.4)]">המשחק נגמר!</h2>
        <p class="text-3xl text-slate-300 mb-4 font-medium">זכיתם ב-</p>
        <div id="mil-end-prize" class="text-7xl font-black text-emerald-400 mb-12 drop-shadow-[0_0_25px_rgba(52,211,153,0.6)]">0 ₪</div>
        
        <button onclick="initMillionaire()" class="bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 border border-blue-400 text-white py-4 px-12 rounded-xl font-bold text-2xl transition-all shadow-lg hover:scale-105 active:scale-95 flex items-center">
            <i class="fa-solid fa-rotate-right mr-3"></i> שחק שוב
        </button>
    </div>

    <script>
        // Questions array incorporating LaTeX Math expressions formatted for MathJax (Now 10 questions)
        const milQuestions = [
            { q: "ממוצע הציונים הוא $80$. המורה הוסיף $5$ נקודות לכולם. מה הממוצע $\\bar{x}$ החדש?", opts: ["$80$", "$85$", "$400$", "$75$"], ans: 1 },
            { q: "טווח הנתונים הוא $20$. אם נוסיף $10$ לכל נתון, הטווח החדש יהיה:", opts: ["$30$", "$10$", "$20$", "$200$"], ans: 2 },
            { q: "מה קורה לשונות $S^2$ כשמכפילים את כל הנתונים ב-$3$?", opts: ["מוכפלת ב-$3$", "לא משתנה", "גדלה ב-$3$", "מוכפלת ב-$9$"], ans: 3 },
            { q: "נתונה קבוצת מספרים זהים: $8, 8, 8, 8$. מהי סטיית התקן $S$?", opts: ["$0$", "$8$", "$32$", "$1$"], ans: 0 },
            { q: "אם מוסיפים קבוע $C$ שלילי לכל הנתונים בקבוצה, מה יקרה לסטיית התקן?", opts: ["תגדל ב-$C$", "תקטן ב-$C$", "לא תשתנה כלל", "תהפוך לשלילית"], ans: 2 },
            { q: "ממוצע $60$, סטיית תקן $4$. הוכפל ב-$2$. מה הנתונים החדשים?", opts: ["<span dir=\"ltr\" class=\"inline-block\">$\\bar{x} = 120, S = 8$</span>", "<span dir=\"ltr\" class=\"inline-block\">$\\bar{x} = 120, S = 16$</span>", "<span dir=\"ltr\" class=\"inline-block\">$\\bar{x} = 60, S = 8$</span>", "<span dir=\"ltr\" class=\"inline-block\">$\\bar{x} = 62, S = 6$</span>"], ans: 0 },
            { q: "אם נכפיל את כל הנתונים ב- <span dir=\"ltr\" class=\"inline-block\">$-1$</span>, מה יקרה לממוצע ולשונות?", opts: ["שניהם יהפכו לשליליים", "הממוצע ישנה סימן, השונות תישאר חיובית וללא שינוי", "שניהם לא ישתנו", "הממוצע לא ישתנה, השונות תשנה סימן"], ans: 1 },
            { q: "ממוצע $50$, שונות $25$. חילקו ב-$5$ והוסיפו $10$. מה סטיית התקן $S$ החדשה?", opts: ["$5$", "$11$", "$1$", "$3$"], ans: 2 },
            { q: "קבוצת נתונים הוכפלה בקבוע $K$ חיובי. השונות גדלה פי $16$. מהו $K$?", opts: ["$16$", "$8$", "$4$", "$256$"], ans: 2 },
            { q: "קבוצת נתונים עברה טרנספורמציה. השונות החדשה קטנה פי $4$. איזו פעולה בוודאות נעשתה?", opts: ["חיסרו $4$ מכל נתון", "חילקו כל נתון ב-$2$", "חילקו כל נתון ב-$4$", "הוציאו שורש לכל נתון"], ans: 1 }
        ];
        
        // Expanded prizes array for 10 questions
        const prizes = ["100 ₪", "500 ₪", "1,000 ₪", "2,500 ₪", "5,000 ₪", "16,000 ₪", "32,000 ₪", "64,000 ₪", "250,000 ₪", "1,000,000 ₪"];
        let currQ = 0;
        let isAnswering = false;

        function initMillionaire() {
            currQ = 0;
            isAnswering = false;
            document.getElementById('mil-end-screen').classList.add('hidden');
            document.getElementById('mil-end-screen').classList.remove('flex');
            renderLadder();
            loadMilQuestion();
        }

        function renderLadder() {
            const ladder = document.getElementById('mil-ladder');
            ladder.innerHTML = '';
            for (let i = 0; i < prizes.length; i++) {
                const div = document.createElement('div');
                div.className = `mil-ladder-item flex justify-between ${i === currQ ? 'active' : ''} ${i < currQ ? 'passed' : 'text-slate-500'}`;
                div.innerHTML = `<span>${i+1}</span> <span>${prizes[i]}</span>`;
                ladder.appendChild(div);
            }
        }

        function loadMilQuestion() {
            if(currQ >= milQuestions.length) {
                winMillionaire();
                return;
            }
            
            const qObj = milQuestions[currQ];
            // Use innerHTML so MathJax captures the math markup correctly
            document.getElementById('mil-q-text').innerHTML = qObj.q;
            
            // Reset buttons
            for(let i = 0; i < 4; i++) {
                const btn = document.getElementById(`mil-opt-${i}`).parentElement;
                btn.className = "mil-btn py-5 px-8 text-xl font-bold flex items-center justify-center text-center relative group";
                document.getElementById(`mil-opt-${i}`).innerHTML = qObj.opts[i];
            }
            
            renderLadder();
            isAnswering = false;
            
            // Re-render LaTeX math expressions
            if(window.MathJax) {
                MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err.message));
            }
        }

        function checkMilAnswer(selectedIdx) {
            if (isAnswering) return;
            isAnswering = true;
            
            const qObj = milQuestions[currQ];
            const btn = document.getElementById(`mil-opt-${selectedIdx}`).parentElement;
            
            if (selectedIdx === qObj.ans) {
                // Correct
                btn.classList.add('correct');
                setTimeout(() => {
                    currQ++;
                    loadMilQuestion();
                }, 1800);
            } else {
                // Wrong
                btn.classList.add('wrong');
                const correctBtn = document.getElementById(`mil-opt-${qObj.ans}`).parentElement;
                setTimeout(() => { correctBtn.classList.add('correct'); }, 700);
                
                setTimeout(() => {
                    loseMillionaire();
                }, 2500);
            }
        }

        function loseMillionaire() {
            const prize = currQ > 0 ? prizes[currQ - 1] : "0 ₪";
            const titleEl = document.getElementById('mil-end-title');
            titleEl.innerText = "טעות בתשובה!";
            titleEl.classList.remove('text-yellow-400');
            titleEl.classList.add('text-red-500');
            
            document.getElementById('mil-end-prize').innerText = prize;
            const endScreen = document.getElementById('mil-end-screen');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
        }

        function winMillionaire() {
            const titleEl = document.getElementById('mil-end-title');
            titleEl.innerText = "מיליונר סטטיסטיקה!";
            titleEl.classList.remove('text-red-500');
            titleEl.classList.add('text-yellow-400');
            
            document.getElementById('mil-end-prize').innerText = "1,000,000 ₪";
            const endScreen = document.getElementById('mil-end-screen');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            triggerConfetti();
        }

        function triggerConfetti() {
            if(window.confetti) {
                let duration = 5000;
                let end = Date.now() + duration;

                (function frame() {
                    confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#eab308', '#ca8a04'] });
                    confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#eab308', '#ca8a04'] });

                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
        }

        // Initialize game on load
        window.onload = () => {
            initMillionaire();
        };
    </script>
</body>
</html>
